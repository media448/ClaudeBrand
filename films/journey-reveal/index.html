    sheen.material.uniforms.uK.value = eOut3(seg(t, HIT.snap + 0.25, HIT.snap + 0.55)) * breathe;
    medalPool.visible = true; medalPool.position.set(M.x, 0.002, M.z + 0.2); medalPool.scale.set(2.6 * s, 1.4 * s, 1);
    medalPool.material.color.copy(hdr(COL.accent, 0.3 * breathe * s));
  } else medalPool.visible = false;

  // ---- particles ----
  let n = 0;
  const putP = (p, c, k, s) => { pPos[n * 3] = p.x; pPos[n * 3 + 1] = p.y; pPos[n * 3 + 2] = p.z; pCol[n * 3] = c.r * k; pCol[n * 3 + 1] = c.g * k; pCol[n * 3 + 2] = c.b * k; pSize[n] = s; n++; };
  const SUB = slice > 0 ? 6 : 1, subT = j => t + slice * ((j + 0.5) / SUB - 0.5);   // in-slice samples for fast particles
  if (t >= HIT.drop && t < HIT.drop + 1.2) for (const q of PSETS.splash) for (let j = 0; j < SUB; j++) { // splash crown, ballistic
    const x = subT(j) - HIT.drop, y = q.up * 0.35 * x - 4.9 * x * x * 0.5; if (y < 0 || x < 0) continue;
    putP(V(Math.cos(q.a) * q.v * x * 0.5, y, Math.sin(q.a) * q.v * x * 0.5), COL.accent, 6 / SUB, q.s);
  }
  if (t >= HIT.line && t < 8.4) for (const q of PSETS.lineDust) {
    const k = eOut3(seg(t, HIT.line, HIT.line + 0.8)) * (1 - seg(t, 7.6, 8.4));
    const p = q.p.clone(); p.y += 0.05 * Math.sin(t * 0.7 + q.ph); p.x += 0.08 * Math.sin(t * 0.4 + q.ph);
    putP(p, q.warm > 0.7 ? COL.accent : COL.white, 0.5 * k, q.s);
  }
  if (t >= 7.4 && t < HIT.still) for (const [i, q] of PSETS.dust.entries()) { // dust in the sunrise, then into the vortex
    const age = t - 7.4, p = q.p.clone().addScaledVector(q.d, age * (1 + 0.3 * Math.sin(age * q.w + i)));
    p.y += 0.04 * Math.sin(age * q.w * 1.3 + i * 0.7);
    const sunK = Math.exp(-((p.x - 0.9) ** 2 + (p.y - 3.4) ** 2) / 10) * (sun.visible ? sun.material.color.r / 5 : 0);
    const appear = eOut3(seg(t, 7.4 + (i % 50) * 0.01, 7.9 + (i % 50) * 0.01));
    vortexPoint(p, t, 0.9 + 0.5 * q.warm);
    putP(p, q.warm > 0.6 ? COL.accent : COL.white, appear * (0.25 + 2.2 * sunK + 1.5 * vortexP(t)), q.s);
  }
  if (bt >= 0) for (const q of PSETS.burst) for (let j = 0; j < SUB; j++) { // out with hard deceleration, back to the medallion, settle
    const t = subT(j), bt = t - HIT.big; if (bt < 0) continue;
    const center = P0.clone().lerp(M, eInOut(seg(t, HIT.big, HIT.snap)));
    const out = 1 - Math.exp(-bt * 9), vel = q.v * (0.6 + 0.4 * Math.cos(q.z * 3));
    const fly = V(Math.cos(q.a) * vel * out * 0.3, Math.sin(q.a) * vel * out * 0.3, q.z * vel * out * 0.15);
    let p, k = 1, size = q.s;
    if (!q.settle) {
      const back = eIn3(seg(t, HIT.big + 0.2, HIT.snap));
      const tgt = q.onRim ? V(Math.cos(q.ta) * (MED_R + 0.03), Math.sin(q.ta) * (MED_R + 0.03), 0.02) : V(Math.cos(q.ta) * q.tr * MED_R, Math.sin(q.ta) * q.tr * MED_R, 0.04);
      p = fly.lerp(tgt, back); k = t < HIT.snap ? 1 : Math.exp(-(t - HIT.snap) * 10); size = q.s * (1 - 0.6 * back);
      if (k < 0.01) continue;
      p.applyQuaternion(face).add(center);
    } else { // a few motes drift down and come to rest by 13.5
      const s = eOut3(seg(t, HIT.big, 13.5));
      p = fly.applyQuaternion(face).add(center).lerp(V(q.sx, q.sy, q.sz + M.z), s * 0.6);
      k = 0.35;
    }
    putP(p, q.warm > 0.25 ? COL.accent : COL.white, (q.settle ? 1.0 : 3) * k / SUB, size * 0.8);
  }
  for (let i = n; i < MAXP; i++) pSize[i] = 0;
  pGeo.setDrawRange(0, n);
  pGeo.attributes.position.needsUpdate = pGeo.attributes.color.needsUpdate = pGeo.attributes.size.needsUpdate = true;
  pMat.uniforms.uFocus.value = camera.position.distanceTo(focusPt);
  return focusPt;
}

// ===================================================================================================
// RENDERING: sub-frames (motion blur + AA + subtle DOF) -> bloom -> anamorphic streak -> grade
// ===================================================================================================
const clipAbove = [new THREE.Plane(V(0, 1, 0), 0)], clipBelow = [new THREE.Plane(V(0, -1, 0), 0)];
const accQuad = new FullScreenQuad(new THREE.ShaderMaterial({
  uniforms: { tex: { value: null }, w: { value: 1 } }, blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, transparent: true,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `uniform sampler2D tex; uniform float w; varying vec2 vUv; void main(){ gl_FragColor = vec4(texture2D(tex, vUv).rgb * w, 1.); }`,
}));
const HALTON = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };
function renderSub(t, k, SPP) {
  const focus = update(t, SPP > 1 ? SHUTTER / SPP : 0);
  if (SPP > 1) { // sub-pixel jitter + small aperture offset (lens re-aimed at the focus point)
    const jx = HALTON(k + 1, 2) - 0.5, jy = HALTON(k + 1, 3) - 0.5, ang = k * 2.39996, ap = 0.006 * Math.sqrt((k + 0.5) / SPP);
    camera.position.add(V(Math.cos(ang) * ap, Math.sin(ang) * ap, 0).applyQuaternion(camera.quaternion)); camera.lookAt(focus);
    camera.setViewOffset(W, H, jx, jy, W, H);
  } else camera.clearViewOffset();
  camera.updateMatrixWorld();
  renderer.setRenderTarget(subRT); renderer.setClearColor(COL.black, 1); renderer.clear();
  world.scale.y = -1; world.updateMatrixWorld(true); renderer.clippingPlanes = clipBelow; renderer.render(scene, camera);   // mirror pass
  world.scale.y = 1; world.updateMatrixWorld(true); renderer.clippingPlanes = []; renderer.render(floorScene, camera);
  renderer.clippingPlanes = clipAbove; renderer.render(scene, camera); renderer.clippingPlanes = [];
}
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.32, 0.5, 1.4);
// anamorphic streak: bright-pass at 1/4 res, wide horizontal blur, accent-tinted
const SW = Math.round(W / 4), SH = Math.round(H / 4), streakA = RT(SW, SH), streakB = RT(SW, SH);
const brightQuad = new FullScreenQuad(new THREE.ShaderMaterial({
  uniforms: { tex: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ vec3 c = texture2D(tex, vUv).rgb; float m = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(4.0, 10.0, m), 1.); }`,
}));
const blurQuad = new FullScreenQuad(new THREE.ShaderMaterial({
  uniforms: { tex: { value: null }, step: { value: 1 }, res: { value: new THREE.Vector2(SW, SH) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `uniform sampler2D tex; uniform float step; uniform vec2 res; varying vec2 vUv;
    void main(){ vec3 s = vec3(0.); float tw = 0.; for (int i = -6; i <= 6; i++) { float w = exp(-float(i*i) / 18.); s += texture2D(tex, vUv + vec2(float(i) * step / res.x, 0.)).rgb * w; tw += w; } gl_FragColor = vec4(s / tw, 1.); }`,
}));
const finalQuad = new FullScreenQuad(new THREE.ShaderMaterial({
  uniforms: { tex: { value: null }, streak: { value: null }, overlay: { value: null }, overlayK: { value: 0 }, seed: { value: 0 }, res: { value: new THREE.Vector2(W, H) },
    tint: { value: COL.accent.clone() }, warm: { value: COL.white.clone() } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `uniform sampler2D tex, streak, overlay; uniform float overlayK, seed; uniform vec2 res; uniform vec3 tint, warm; varying vec2 vUv;
    float hash(vec2 p){ p = fract(p * vec2(443.897, 441.423) + seed); p += dot(p, p.yx + 19.19); return fract((p.x + p.y) * p.x); }
    vec3 enc(vec3 c){ return mix(c * 12.92, 1.055 * pow(c, vec3(1./2.4)) - .055, step(.0031308, c)); }
    void main(){
      vec3 c = texture2D(tex, vUv).rgb;
      vec3 s = texture2D(streak, vUv).rgb; c += tint * dot(s, vec3(.33)) * 0.55;          // streak stays accent-hued
      float m = max(c.r, max(c.g, c.b));
      if (m > 1.) { float hot = 1. - 1. / (1. + (m - 1.) * .35); c = mix(c / m, warm, hot * .85); } // hue-true roll-off to warm white
      vec2 q = (vUv - .5) * vec2(1.78, 1.); c *= mix(1., .8, smoothstep(.45, 1.15, length(q)));
      float l = dot(c, vec3(.2126, .7152, .0722));
      c += (hash(vUv * res) - .5) * .02 * (.25 + sqrt(l));                                   // film grain
      c = clamp(enc(max(c, 0.)), 0., 1.);
      vec4 o = texture2D(overlay, vUv); c = mix(c, o.rgb, o.a * overlayK);
      c += (hash(vUv * res + 7.) - .5) / 255.;                                               // dither
      gl_FragColor = vec4(c, 1.); }`,
}));

// branded variant: wordmark + identity line in the clear space under the medallion (2D overlay)
const overlayCanvas = document.createElement('canvas'); overlayCanvas.width = W; overlayCanvas.height = H;
const overlayTex = new THREE.CanvasTexture(overlayCanvas); overlayTex.colorSpace = THREE.NoColorSpace;
finalQuad.material.uniforms.overlay.value = overlayTex;
let overlayDrawnFor = -1;
async function loadFonts() {
  const faces = [new FontFace('Bebas', 'url(../../brand/fonts/BebasNeue.woff2)'), new FontFace('Lato', 'url(../../brand/fonts/Lato-Italic.woff2)', { style: 'italic' }), new FontFace('Lato', 'url(../../brand/fonts/Lato-Regular.woff2)')];
  for (const f of faces) document.fonts.add(await f.load());
}
function drawOverlay(t) { // masked rises, keyed only on t
  const g = overlayCanvas.getContext('2d'); g.clearRect(0, 0, W, H);
  if (VARIANT !== 'branded') return 0;
  const u = H / 2160, cx = W / 2;
  const rise = (txt, font, color, y, p, spacing = 0) => {
    g.save(); g.font = font; g.letterSpacing = spacing * u + 'px'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    const hgt = parseFloat(font.match(/(\d+(\.\d+)?)px/)[1]);
    g.beginPath(); g.rect(0, y - hgt * 1.05, W, hgt * 1.3); g.clip(); g.fillStyle = color; g.fillText(txt, cx + spacing * u / 2, y + (1 - p) * hgt * 1.2); g.restore();
  };
  const a = eExpo(seg(t, HIT.snap + 0.05, HIT.snap + 0.5)), b = eExpo(seg(t, HIT.snap + 0.2, HIT.snap + 0.65)), c = eExpo(seg(t, HIT.snap + 0.35, HIT.snap + 0.8));
  rise('PRABIN AGARWAL', `${150 * u}px Bebas`, HEX.white, 1650 * u, a, 34);
  rise('Empowering Investors', `italic ${66 * u}px Lato`, HEX.accent, 1762 * u, b, 6);
  rise('AMFI-registered Mutual Fund Distributor  ·  ARN-41541', `${34 * u}px Lato`, 'rgba(244,241,234,0.62)', 2050 * u, c, 2);
  return 1;
}

const sppAt = t => SPP_FIXED || ((t < HIT.drop + 0.1) || (t > HIT.collapse - 0.3 && t < HIT.snap + 0.15) || (t > HIT.line + 0.3 && t < HIT.line + 1.0) ? 8 : 4);
function seek(t) {
  t = clamp(t, 0, DUR);
  const SPP = sppAt(t);
  brandMark.visible = VARIANT === 'branded';
  renderer.setRenderTarget(accRT); renderer.setClearColor(0x000000, 1); renderer.clear();
  for (let k = 0; k < SPP; k++) {
    const ts = SPP > 1 ? t + SHUTTER * ((k + 0.5) / SPP - 0.5) : t;
    renderSub(clamp(ts, 0, DUR), k, SPP);
    renderer.setRenderTarget(accRT); accQuad.material.uniforms.tex.value = subRT.texture; accQuad.material.uniforms.w.value = 1 / SPP; accQuad.render(renderer);
  }
  camera.clearViewOffset();
  bloom.render(renderer, null, accRT, 0, false);
  renderer.setRenderTarget(streakA); brightQuad.material.uniforms.tex.value = accRT.texture; brightQuad.render(renderer);
  [1, 3, 8, 20].forEach((s, i) => { const src = i % 2 ? streakB : streakA, dst = i % 2 ? streakA : streakB; renderer.setRenderTarget(dst); blurQuad.material.uniforms.tex.value = src.texture; blurQuad.material.uniforms.step.value = s; blurQuad.render(renderer); });
  const u = finalQuad.material.uniforms;
  u.tex.value = accRT.texture; u.streak.value = streakA.texture; u.seed.value = mulberry32(Math.round(t * FPS) + 1)();
  u.overlayK.value = drawOverlay(t); overlayTex.needsUpdate = true;
  renderer.setRenderTarget(null); renderer.setClearColor(0x000000, 1); renderer.clear(); finalQuad.render(renderer);
}

// readback for render.mjs: RGBA, bottom-up
const gl = renderer.getContext();
window.FILM = { width: W, height: H, fps: FPS, duration: DUR, flipY: true,
  // variants differ only from the big hit on; render.mjs renders shared frames once
  variants: ['plate', 'branded'], variantsFrom: HIT.big, setVariant: v => { VARIANT = v; },
  pixels: () => { const b = new Uint8Array(W * H * 4); gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, b); return b; } };
window.seek = seek; window.DURATION = DUR;
window.ready = loadFonts().then(() => { seek(+Q.get('t') || 0); return true; });

// preview only: click to play with the score (rAF is never used in render mode)
if (!RENDER) {
  const audio = new Audio('score.wav');
  await window.ready;
  renderer.domElement.addEventListener('click', () => { audio.currentTime = 0; audio.play(); const loop = () => { seek(audio.currentTime); if (!audio.paused) requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
}
</script>
</body>
